name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/airplanetoggler

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirplaneToggler"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.airplanetoggler"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.airplanetoggler"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="Airplane Toggler"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ToggleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="airplane_mode_toggle"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/MainActivity.kt <<'EOF'
          package com.example.airplanetoggler

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val onField = EditText(this).apply {
                      hint = "مدة وضع الطائرة مفعّلاً (بالثواني)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("5")
                  }
                  val offField = EditText(this).apply {
                      hint = "المدة بين كل مرة (بالثواني) - ساعة = 3600"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("3600")
                  }
                  val start = Button(this).apply { text = "ابدأ" }
                  val stop = Button(this).apply { text = "إيقاف" }

                  start.setOnClickListener {
                      val onSec = onField.text.toString().toLongOrNull() ?: 5L
                      val offSec = offField.text.toString().toLongOrNull() ?: 3600L
                      startForegroundService(
                          Intent(this, ToggleService::class.java)
                              .putExtra("on", onSec)
                              .putExtra("off", offSec)
                      )
                  }
                  stop.setOnClickListener {
                      startService(Intent(this, ToggleService::class.java).setAction("STOP"))
                  }

                  root.addView(onField)
                  root.addView(offField)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
              }
          }
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/ToggleService.kt <<'EOF'
          package com.example.airplanetoggler

          import android.app.*
          import android.content.Intent
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import kotlin.concurrent.thread

          class ToggleService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var airplaneOn = false
              private var onSec = 5L
              private var offSec = 3600L

              private val tick = object : Runnable {
                  override fun run() {
                      airplaneOn = !airplaneOn
                      setAirplane(airplaneOn)
                      val delay = if (airplaneOn) onSec else offSec
                      handler.postDelayed(this, delay * 1000)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  onSec = intent?.getLongExtra("on", 5L) ?: 5L
                  offSec = intent?.getLongExtra("off", 3600L) ?: 3600L

                  val channelId = "toggle"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(channelId, "Airplane Toggler", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notification = Notification.Builder(this, channelId)
                      .setContentTitle("Airplane Toggler يعمل")
                      .setContentText("تبديل وضع الطائرة تلقائياً")
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notification)

                  handler.removeCallbacks(tick)
                  airplaneOn = false
                  handler.post(tick)
                  return START_STICKY
              }

              override fun onDestroy() {
                  handler.removeCallbacks(tick)
                  setAirplane(false)
                  super.onDestroy()
              }

              private fun setAirplane(enable: Boolean) {
                  thread {
                      val v = if (enable) 1 else 0
                      val state = if (enable) "true" else "false"

                      val rootOk = runSu(
                          "cmd connectivity airplane-mode " + (if (enable) "enable" else "disable")
                      ) || runSu(
                          "settings put global airplane_mode_on $v; " +
                          "am broadcast -a android.intent.action.AIRPLANE_MODE --ez state $state"
                      )
                      if (rootOk) return@thread

                      try {
                          Settings.Global.putInt(contentResolver, Settings.Global.AIRPLANE_MODE_ON, v)
                      } catch (e: SecurityException) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun runSu(cmd: String): Boolean = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", cmd))
                  p.waitFor() == 0
              } catch (e: Exception) {
                  false
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AirplaneToggler-apk
          path: app/build/outputs/apk/debug/app-debug.apk
