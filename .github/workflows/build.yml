name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/airplanetoggler

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirplaneToggler"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.airplanetoggler"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.airplanetoggler"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Airplane Toggler"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ToggleService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="airplane_mode_toggle"/>
                  </service>

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/MainActivity.kt <<'EOF'
          package com.example.airplanetoggler

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*
          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private val listener = Shizuku.OnRequestPermissionResultListener { _, _ -> refresh() }

              private fun ready(): Boolean = try {
                  Shizuku.pingBinder() &&
                      Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) {
                  false
              }

              private fun refresh() {
                  status.text = try {
                      when {
                          !Shizuku.pingBinder() -> "Shizuku غير مشغّل. شغّله من تطبيق Shizuku أولاً"
                          Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED ->
                              "الإذن غير ممنوح. اضغط (منح إذن Shizuku)"
                          else -> "جاهز ✓"
                      }
                  } catch (e: Throwable) {
                      "Shizuku غير متاح"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  try {
                      Shizuku.addRequestPermissionResultListener(listener)
                  } catch (e: Throwable) {
                  }

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  status = TextView(this).apply { textSize = 18f }
                  val grant = Button(this).apply { text = "منح إذن Shizuku" }
                  val onField = EditText(this).apply {
                      hint = "مدة وضع الطائرة مفعّلاً (بالثواني)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("5")
                  }
                  val offField = EditText(this).apply {
                      hint = "المدة بين كل مرة (بالثواني) - ساعة = 3600"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("3600")
                  }
                  val start = Button(this).apply { text = "ابدأ" }
                  val stop = Button(this).apply { text = "إيقاف" }

                  grant.setOnClickListener {
                      try {
                          if (Shizuku.pingBinder()) Shizuku.requestPermission(1001) else refresh()
                      } catch (e: Throwable) {
                          refresh()
                      }
                  }
                  start.setOnClickListener {
                      if (!ready()) {
                          refresh()
                          Toast.makeText(this, "Shizuku غير جاهز", Toast.LENGTH_LONG).show()
                      } else {
                          val onSec = onField.text.toString().toLongOrNull() ?: 5L
                          val offSec = offField.text.toString().toLongOrNull() ?: 3600L
                          startForegroundService(
                              Intent(this, ToggleService::class.java)
                                  .putExtra("on", onSec)
                                  .putExtra("off", offSec)
                          )
                      }
                  }
                  stop.setOnClickListener {
                      startService(Intent(this, ToggleService::class.java).setAction("STOP"))
                  }

                  root.addView(status)
                  root.addView(grant)
                  root.addView(onField)
                  root.addView(offField)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
                  refresh()
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              override fun onDestroy() {
                  try {
                      Shizuku.removeRequestPermissionResultListener(listener)
                  } catch (e: Throwable) {
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/ToggleService.kt <<'EOF'
          package com.example.airplanetoggler

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.widget.Toast
          import kotlin.concurrent.thread
          import rikka.shizuku.Shizuku

          class ToggleService : Service() {

              @Volatile private var token = 0
              private var wl: PowerManager.WakeLock? = null
              private val ui = Handler(Looper.getMainLooper())

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val onSec = intent?.getLongExtra("on", 5L) ?: 5L
                  val offSec = intent?.getLongExtra("off", 3600L) ?: 3600L

                  val channelId = "toggle"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(channelId, "Airplane Toggler", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notification = Notification.Builder(this, channelId)
                      .setContentTitle("Airplane Toggler يعمل")
                      .setContentText("تبديل وضع الطائرة تلقائياً")
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notification)

                  if (wl == null) {
                      wl = (getSystemService(Context.POWER_SERVICE) as PowerManager)
                          .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "airplane:loop")
                          .apply { acquire() }
                  }

                  val my = ++token
                  thread {
                      var warned = false
                      while (token == my) {
                          val ok = sh("cmd connectivity airplane-mode enable")
                          if (!ok && !warned) {
                              warned = true
                              toast("فشل التنفيذ. تأكد أن Shizuku يعمل")
                          }
                          if (!pause(onSec, my)) break
                          sh("cmd connectivity airplane-mode disable")
                          if (!pause(offSec, my)) break
                      }
                  }
                  return START_STICKY
              }

              private fun pause(sec: Long, my: Int): Boolean {
                  var left = sec * 1000
                  while (left > 0 && token == my) {
                      Thread.sleep(minOf(left, 500L))
                      left -= 500
                  }
                  return token == my
              }

              private fun toast(msg: String) {
                  ui.post { Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
              }

              private fun sh(cmd: String): Boolean = try {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  p.waitFor() == 0
              } catch (e: Throwable) {
                  false
              }

              override fun onDestroy() {
                  token++
                  val lock = wl
                  wl = null
                  thread {
                      sh("cmd connectivity airplane-mode disable")
                      lock?.release()
                  }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AirplaneToggler-apk
          path: app/build/outputs/apk/debug/app-debug.apk
