name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/airplanetoggler
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirplaneToggler"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.airplanetoggler"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.airplanetoggler"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="service_desc">يفتح الإعدادات السريعة ويضغط على زر وضع الطائرة تلقائياً كل فترة محددة.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows"
              android:isAccessibilityTool="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100"/>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Airplane Toggler"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AirplaneService"
                      android:exported="true"
                      android:label="Airplane Toggler"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/MainActivity.kt <<'EOF'
          package com.example.airplanetoggler

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  val info = TextView(this).apply {
                      text = "1) فعّل الخدمة من إعدادات إمكانية الوصول\n" +
                          "2) أضف زر وضع الطائرة إلى الإعدادات السريعة\n" +
                          "3) اترك الشاشة مفتوحة وغير مقفلة"
                  }
                  val access = Button(this).apply { text = "فتح إعدادات إمكانية الوصول" }
                  val onField = EditText(this).apply {
                      hint = "مدة وضع الطائرة مفعّلاً (بالثواني)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("5")
                  }
                  val offField = EditText(this).apply {
                      hint = "المدة بين كل مرة (بالثواني) - ساعة = 3600"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("60")
                  }
                  val start = Button(this).apply { text = "ابدأ" }
                  val stop = Button(this).apply { text = "إيقاف" }

                  access.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  start.setOnClickListener {
                      val svc = AirplaneService.instance
                      if (svc == null) {
                          Toast.makeText(this, "فعّل الخدمة أولاً من إعدادات إمكانية الوصول", Toast.LENGTH_LONG).show()
                      } else {
                          val onSec = onField.text.toString().toLongOrNull() ?: 5L
                          val offSec = offField.text.toString().toLongOrNull() ?: 60L
                          svc.start(onSec, offSec)
                          Toast.makeText(this, "بدأ التشغيل", Toast.LENGTH_SHORT).show()
                      }
                  }
                  stop.setOnClickListener {
                      AirplaneService.instance?.stop()
                      Toast.makeText(this, "تم الإيقاف", Toast.LENGTH_SHORT).show()
                  }

                  root.addView(info)
                  root.addView(access)
                  root.addView(onField)
                  root.addView(offField)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
              }
          }
          EOF

          cat > app/src/main/java/com/example/airplanetoggler/AirplaneService.kt <<'EOF'
          package com.example.airplanetoggler

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast

          class AirplaneService : AccessibilityService() {

              companion object {
                  var instance: AirplaneService? = null
              }

              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var airplaneOn = false
              private var onSec = 5L
              private var offSec = 60L

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      toggle()
                      airplaneOn = !airplaneOn
                      val delay = if (airplaneOn) onSec else offSec
                      handler.postDelayed(this, delay * 1000)
                  }
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  instance = null
                  return super.onUnbind(intent)
              }

              fun start(on: Long, off: Long) {
                  handler.removeCallbacksAndMessages(null)
                  onSec = on
                  offSec = off
                  running = true
                  handler.post(tick)
              }

              fun stop() {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  if (airplaneOn) {
                      toggle()
                      airplaneOn = false
                  }
              }

              private fun toggle() {
                  performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)
                  handler.postDelayed({ clickTile(0) }, 1200)
              }

              private fun clickTile(attempt: Int) {
                  if (findAndClick()) {
                      handler.postDelayed({ performGlobalAction(GLOBAL_ACTION_BACK) }, 800)
                  } else if (attempt < 3) {
                      handler.postDelayed({ clickTile(attempt + 1) }, 700)
                  } else {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                      Toast.makeText(
                          this,
                          "لم أجد زر وضع الطائرة. أضفه إلى الإعدادات السريعة",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              private fun findAndClick(): Boolean {
                  val keys = listOf("Airplane", "Flight mode", "الطائرة", "الطيران")
                  for (w in windows) {
                      val rootNode = w.root ?: continue
                      for (k in keys) {
                          val nodes = rootNode.findAccessibilityNodeInfosByText(k)
                          for (n in nodes) {
                              var c: AccessibilityNodeInfo? = n
                              while (c != null && !c.isClickable) c = c.parent
                              if (c != null && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                                  return true
                              }
                          }
                      }
                  }
                  return false
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AirplaneToggler-apk
          path: app/build/outputs/apk/debug/app-debug.apk
